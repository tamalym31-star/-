<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صوت صدى الهم - المنبه الملكي</title>
    <style>
        :root {
            --bg-color: #050505;
            --terminal-green: #00ff66;
            --terminal-dark: #003311;
            --border-glow: 0 0 15px rgba(0, 255, 102, 0.4);
        }

        body {
            background-color: var(--bg-color);
            color: var(--terminal-green);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-y: auto;
        }

        .container {
            background: rgba(0, 20, 5, 0.9);
            border: 2px solid var(--terminal-green);
            box-shadow: var(--border-glow);
            padding: 25px;
            border-radius: 10px;
            width: 450px;
            text-align: center;
            margin: 20px 0;
        }

        .logo-title {
            font-size: 1.4rem;
            color: #fff;
            text-shadow: 0 0 10px var(--terminal-green);
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .logo-subtitle {
            font-size: 0.8rem;
            color: var(--terminal-green);
            margin-bottom: 15px;
            opacity: 0.8;
        }

        .clock-display {
            font-size: 2.2rem;
            margin: 15px 0;
            background: #000;
            border: 1px dashed var(--terminal-green);
            padding: 10px;
            letter-spacing: 2px;
        }

        .section {
            margin: 15px 0;
            border-top: 1px solid var(--terminal-dark);
            padding-top: 12px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            text-align: right;
        }

        input[type="time"] {
            background: #000;
            color: var(--terminal-green);
            border: 1px solid var(--terminal-green);
            padding: 8px;
            font-family: inherit;
            font-size: 1.1rem;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }

        input[type="file"] {
            display: none;
        }

        .file-upload-btn {
            display: block;
            background: var(--terminal-dark);
            color: var(--terminal-green);
            border: 1px solid var(--terminal-green);
            padding: 10px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 8px;
            text-align: center;
            box-sizing: border-box;
            transition: 0.2s;
        }

        .file-upload-btn:hover {
            background: var(--terminal-green);
            color: #000;
        }

        button {
            background: var(--terminal-dark);
            color: var(--terminal-green);
            border: 1px solid var(--terminal-green);
            padding: 8px 15px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin: 5px 2px;
            transition: 0.2s;
        }

        button:hover {
            background: var(--terminal-green);
            color: #000;
            box-shadow: 0 0 10px var(--terminal-green);
        }

        button.active {
            background: #ff0055;
            border-color: #ff0055;
            color: #fff;
        }

        .alarms-list {
            margin-top: 15px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid var(--terminal-dark);
            padding: 5px;
            background: #000;
        }

        .alarm-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 30, 10, 0.6);
            border: 1px solid var(--terminal-green);
            padding: 8px 10px;
            margin-bottom: 6px;
            border-radius: 4px;
            font-size: 1.1rem;
        }

        .delete-alarm {
            background: #ff0055 !important;
            border-color: #ff0055 !important;
            color: #fff !important;
            padding: 2px 8px !important;
            font-size: 0.8rem;
        }

        #status {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #00cc55;
            text-align: center;
        }

        .alert-box {
            animation: blink 0.8s infinite alternate;
        }

        @keyframes blink {
            from { border-color: var(--terminal-green); }
            to { border-color: #ff0055; box-shadow: 0 0 25px #ff0055; }
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div class="logo-title">👑 صوت صدى الهم</div>
        <div class="logo-subtitle">// نظام التنبيه الصوتي المخصص</div>
        
        <div class="clock-display" id="digitalClock">00:00:00</div>

        <!-- 1. قسم الصوت (تسجيل أو رفع ملف) -->
        <div class="section">
            <label>1. مصدر صوت المنبه:</label>
            <div style="display: flex; gap: 5px; justify-content: center;">
                <button id="recordBtn" type="button" onclick="toggleRecording()" style="flex: 1;">تسجيل صوت 🎙️</button>
                <button id="playRecordBtn" type="button" onclick="playRecording()" disabled style="flex: 1;">استماع 🔊</button>
            </div>
            
            <label for="audioFileInput" class="file-upload-btn">📁 رفع ملف صوتي من الجهاز (MP3)</label>
            <input type="file" id="audioFileInput" accept="audio/*" onchange="loadAudioFile(event)">
            
            <div id="recordStatus" style="font-size: 0.75rem; margin-top: 8px; color:#00cc55; text-align:center;">لم يتم تحديد صوت بعد</div>
        </div>

        <!-- 2. قسم أوقات المنبه المتعددة -->
        <div class="section">
            <label for="alarmTime">2. إضافة وقت منبه جديد:</label>
            <input type="time" id="alarmTime">
            <button type="button" onclick="addAlarm()" style="width:100%; margin-top:8px; background:var(--terminal-green); color:#000;">إضافة للجدول ➕</button>
            
            <div class="alarms-list" id="alarmsList">
                <div style="text-align:center; color:#555; font-size:0.8rem; padding:10px;">لا توجد منبهات مفعلة حالياً</div>
            </div>
        </div>

        <div id="status">المنبه في انتظار الإضافة...</div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let recordedAudio = null;
        let alarmsArray = [];

        function updateClock() {
            try {
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                
                const clockElem = document.getElementById('digitalClock');
                if (clockElem) {
                    clockElem.innerText = `${hours}:${minutes}:${seconds}`;
                }

                const currentTimeStr = `${hours}:${minutes}`;
                alarmsArray.forEach(alarm => {
                    if (alarm.time === currentTimeStr && alarm.active && !alarm.triggered) {
                        alarm.triggered = true;
                        triggerAlarm(alarm.time);
                    }
                });
            } catch (e) {
                console.error("خطأ في الوقت:", e);
            }
        }
        setInterval(updateClock, 1000);

        async function toggleRecording() {
            const btn = document.getElementById('recordBtn');
            const statusDiv = document.getElementById('recordStatus');

            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        recordedAudio = new Audio(URL.createObjectURL(audioBlob));
                        recordedAudio.loop = true;
                        document.getElementById('playRecordBtn').disabled = false;
                        statusDiv.innerText = "حالة الصوت: تم التسجيل بنجاح! ✅";
                    };

                    mediaRecorder.start();
                    btn.innerText = "إيقاف ⏹️";
                    btn.classList.add("active");
                    statusDiv.innerText = "جاري التسجيل... تحدث الآن";
                } catch (err) {
                    alert("خطأ: يرجى السماح للمتصفح بالوصول إلى الميكروفون.");
                }
            } else {
                mediaRecorder.stop();
                btn.innerText = "تسجيل صوت 🎙️";
                btn.classList.remove("active");
            }
        }

        function loadAudioFile(event) {
            const file = event.target.files[0];
            const statusDiv = document.getElementById('recordStatus');
            if (file) {
                recordedAudio = new Audio(URL.createObjectURL(file));
                recordedAudio.loop = true;
                document.getElementById('playRecordBtn').disabled = false;
                statusDiv.innerText = `حالة الصوت: تم تحميل (${file.name}) ✅`;
            }
        }

        function playRecording() {
            if (recordedAudio) {
                recordedAudio.currentTime = 0;
                recordedAudio.play().catch(e => console.log("تعذر التشغيل المباشر"));
            }
        }

        function addAlarm() {
            const timeInput = document.getElementById('alarmTime').value;
            if (!timeInput) {
                alert("الرجاء اختيار الوقت أولاً!");
                return;
            }
            if (!recordedAudio) {
                alert("الرجاء تسجيل صوت أو رفع ملف صوتي أولاً!");
                return;
            }

            if (alarmsArray.some(a => a.time === timeInput)) {
                alert("هذا الوقت موجود مسبقاً في القائمة!");
                return;
            }

            alarmsArray.push({ time: timeInput, active: true, triggered: false });
            renderAlarmsList();
            document.getElementById('alarmTime').value = '';
            document.getElementById('status').innerText = `تمت إضافة منبه (${alarmsArray.length} نشط)`;
        }

        function removeAlarm(index) {
            alarmsArray.splice(index, 1);
            renderAlarmsList();
            if (alarmsArray.length === 0) {
                document.getElementById('status').innerText = "لا توجد منبهات مفعلة حالياً";
            }
        }

        function renderAlarmsList() {
            const listContainer = document.getElementById('alarmsList');
            if (alarmsArray.length === 0) {
                listContainer.innerHTML = `<div style="text-align:center; color:#555; font-size:0.8rem; padding:10px;">لا توجد منبهات مفعلة حالياً</div>`;
                return;
            }

            let html = '';
            alarmsArray.forEach((alarm, index) => {
                html += `
                    <div class="alarm-item">
                        <span>⏰ ${alarm.time}</span>
                        <button class="delete-alarm" type="button" onclick="removeAlarm(${index})">حذف 🗑️</button>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }

        function triggerAlarm(timeStr) {
            document.getElementById('mainContainer').classList.add('alert-box');
            if (recordedAudio) {
                recordedAudio.currentTime = 0;
                recordedAudio.play().catch(e => console.log("يحتاج المتصفح لتفاعل سابق لتشغيل الصوت"));
            }
            if (navigator.vibrate) navigator.vibrate([500, 250, 500, 250]);

            document.getElementById('status').innerHTML = `🚨 <strong>حان وقت منبه الساعة ${timeStr}!</strong> <br><button type="button" onclick="stopAlarmRing()" style="background:#ff0055; margin-top:10px; color:#fff;">إيقاف المنبه 🛑</button>`;
        }

        function stopAlarmRing() {
            if (recordedAudio) {
                recordedAudio.pause();
                recordedAudio.currentTime = 0;
            }
            alarmsArray.forEach(alarm => alarm.triggered = false);
            document.getElementById('mainContainer').classList.remove('alert-box');
            document.getElementById('status').innerText = "تم إيقاف المنبه. في انتظار الموعد القادم...";
            renderAlarmsList();
        }
    </script>
</body>
</html>
