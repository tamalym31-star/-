<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صوت صدى الهم - المنبه الملكي</title>
    <style>
        :root {
            --bg-color: #050505;
            --terminal-green: #00ff66;
            --terminal-dark: #003311;
            --border-glow: 0 0 15px rgba(0, 255, 102, 0.4);
        }

        body {
            background-color: var(--bg-color);
            color: var(--terminal-green);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background: rgba(0, 20, 5, 0.9);
            border: 2px solid var(--terminal-green);
            box-shadow: var(--border-glow);
            padding: 30px;
            border-radius: 10px;
            width: 420px;
            text-align: center;
        }

        .logo-title {
            font-size: 1.4rem;
            color: #fff;
            text-shadow: 0 0 10px var(--terminal-green);
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .logo-subtitle {
            font-size: 0.8rem;
            color: var(--terminal-green);
            margin-bottom: 15px;
            opacity: 0.8;
        }

        .clock-display {
            font-size: 2.2rem;
            margin: 20px 0;
            background: #000;
            border: 1px dashed var(--terminal-green);
            padding: 10px;
            letter-spacing: 2px;
        }

        .section {
            margin: 15px 0;
            border-top: 1px solid var(--terminal-dark);
            padding-top: 12px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        input[type="time"] {
            background: #000;
            color: var(--terminal-green);
            border: 1px solid var(--terminal-green);
            padding: 8px;
            font-family: inherit;
            font-size: 1.2rem;
            border-radius: 4px;
            width: 80%;
            text-align: center;
        }

        button {
            background: var(--terminal-dark);
            color: var(--terminal-green);
            border: 1px solid var(--terminal-green);
            padding: 10px 18px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin: 5px;
            transition: 0.2s;
        }

        button:hover {
            background: var(--terminal-green);
            color: #000;
            box-shadow: 0 0 10px var(--terminal-green);
        }

        button.active {
            background: #ff0055;
            border-color: #ff0055;
            color: #fff;
        }

        #status {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #00cc55;
        }

        .alert-box {
            animation: blink 0.8s infinite alternate;
        }

        @keyframes blink {
            from { border-color: var(--terminal-green); }
            to { border-color: #ff0055; box-shadow: 0 0 25px #ff0055; }
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <!-- الشعار الجديد -->
        <div class="logo-title">👑 صوت صدى الهم</div>
        <div class="logo-subtitle">// نظام التنبيه الصوتي المخصص</div>
        
        <div class="clock-display" id="digitalClock">00:00:00</div>

        <!-- قسم التسجيل الصوتي -->
        <div class="section">
            <label>1. تسجيل رسالة المنبه الخاصة بك:</label>
            <button id="recordBtn" type="button" onclick="toggleRecording()">بدء التسجيل 🎙️</button>
            <button id="playRecordBtn" type="button" onclick="playRecording()" disabled>استماع 🔊</button>
            <div id="recordStatus">حالة التسجيل: لم يتم التسجيل بعد</div>
        </div>

        <!-- قسم ضبط الوقت -->
        <div class="section">
            <label for="alarmTime">2. حدد وقت الرنين:</label>
            <input type="time" id="alarmTime">
            <br><br>
            <button id="setAlarmBtn" type="button" onclick="toggleAlarm()">تفعيل المنبه ⏰</button>
        </div>

        <div id="status">المنبه غير مفعل</div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let audioBlob = null;
        let recordedAudio = null;
        let alarmTimeSet = null;
        let isAlarmActive = false;
        let alarmTriggered = false;

        // تحديث الساعة الحالية
        function updateClock() {
            try {
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                
                const clockElem = document.getElementById('digitalClock');
                if (clockElem) {
                    clockElem.innerText = `${hours}:${minutes}:${seconds}`;
                }

                // فحص حالة المنبه بدقة
                if (isAlarmActive && !alarmTriggered && alarmTimeSet) {
                    const currentTimeStr = `${hours}:${minutes}`;
                    if (currentTimeStr === alarmTimeSet && now.getSeconds() === 0) {
                        triggerAlarm();
                    }
                }
            } catch (e) {
                console.error("خطأ في تحديث الوقت:", e);
            }
        }
        setInterval(updateClock, 1000);

        // تسجيل الصوت عبر الميكروفون
        async function toggleRecording() {
            const btn = document.getElementById('recordBtn');
            const statusDiv = document.getElementById('recordStatus');

            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        recordedAudio = new Audio(audioUrl);
                        recordedAudio.loop = true; // تكرار الصوت تلقائياً
                        document.getElementById('playRecordBtn').disabled = false;
                        statusDiv.innerText = "حالة التسجيل: تم تسجيل الصوت بنجاح! ✅";
                    };

                    mediaRecorder.start();
                    btn.innerText = "إيقاف التسجيل ⏹️";
                    btn.classList.add("active");
                    statusDiv.innerText = "جاري التسجيل الآن... تحدث بوضوح";
                } catch (err) {
                    alert("خطأ: يرجى التأكد من منح المتصفح صلاحية الوصول إلى الميكروفون.");
                }
            } else {
                mediaRecorder.stop();
                btn.innerText = "بدء التسجيل 🎙️";
                btn.classList.remove("active");
            }
        }

        // استماع للتسجيل التجريبي
        function playRecording() {
            if (recordedAudio) {
                recordedAudio.currentTime = 0;
                recordedAudio.play().catch(e => console.log("تعذر التشغيل المباشر"));
            }
        }

        // تفعيل أو إلغاء تفعيل المنبه
        function toggleAlarm() {
            const timeInput = document.getElementById('alarmTime').value;
            const btn = document.getElementById('setAlarmBtn');
            const status = document.getElementById('status');

            if (!isAlarmActive) {
                if (!timeInput) {
                    alert("الرجاء تحديد وقت المنبه أولاً!");
                    return;
                }
                if (!audioBlob) {
                    alert("الرجاء تسجيل صوت المنبه أولاً!");
                    return;
                }
                alarmTimeSet = timeInput;
                isAlarmActive = true;
                btn.innerText = "إلغاء المنبه ❌";
                btn.classList.add("active");
                status.innerText = `المنبه مفعل في تمام الساعة: ${alarmTimeSet} ⏳`;
                document.getElementById('alarmTime').disabled = true;
            } else {
                isAlarmActive = false;
                alarmTriggered = false;
                btn.innerText = "تفعيل المنبه ⏰";
                btn.classList.remove("active");
                status.innerText = "المنبه غير مفعل";
                document.getElementById('alarmTime').disabled = false;
                if (recordedAudio) recordedAudio.pause();
                document.getElementById('mainContainer').classList.remove('alert-box');
            }
        }

        // إطلاق المنبه وتكرار الصوت
        function triggerAlarm() {
            alarmTriggered = true;
            document.getElementById('mainContainer').classList.add('alert-box');
            
            if (recordedAudio) {
                recordedAudio.currentTime = 0;
                recordedAudio.play().catch(e => {
                    console.log("يتطلب المتصفح تفاعلاً لتشغيل الصوت.");
                });
            }

            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `🚨 <strong>حان وقت صدى الهم!</strong> <br><button type="button" onclick="stopAlarmRing()" style="background:#ff0055; margin-top:10px; color:#fff;">إيقاف المنبه 🛑</button>`;
        }

        // إيقاف رنين المنبه
        function stopAlarmRing() {
            if (recordedAudio) {
                recordedAudio.pause();
                recordedAudio.currentTime = 0;
            }
            alarmTriggered = false;
            isAlarmActive = false;
            
            const btn = document.getElementById('setAlarmBtn');
            btn.innerText = "تفعيل المنبه ⏰";
            btn.classList.remove("active");
            document.getElementById('status').innerText = "المنبه غير مفعل";
            document.getElementById('alarmTime').disabled = false;
            document.getElementById('mainContainer').classList.remove('alert-box');
        }
    </script>
</body>
</html>
